apiVersion: v1
kind: Namespace
metadata:
  name: phoenix

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: phoenix-config
  namespace: phoenix
data:
  BACKEND_URL: "http://phoenix-backend:8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-postgres
  namespace: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-postgres
  template:
    metadata:
      labels:
        app: phoenix-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: phoenix-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: phoenix-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phoenix-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: phoenix
spec:
  selector:
    app: phoenix-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-backend
  namespace: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-backend
  template:
    metadata:
      labels:
        app: phoenix-backend
    spec:
      containers:
        - name: backend
          image: project-phoenix-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PHOENIX_DB_HOST
              value: "postgres"
            - name: PHOENIX_DB_PORT
              value: "5432"
            - name: PHOENIX_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: phoenix-db
                  key: POSTGRES_DB
            - name: PHOENIX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: phoenix-db
                  key: POSTGRES_USER
            - name: PHOENIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phoenix-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-backend
  namespace: phoenix
spec:
  selector:
    app: phoenix-backend
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-frontend
  namespace: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix-frontend
  template:
    metadata:
      labels:
        app: phoenix-frontend
    spec:
      containers:
        - name: frontend
          image: project-phoenix-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: phoenix-config
                  key: BACKEND_URL

---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-frontend
  namespace: phoenix
spec:
  type: NodePort
  selector:
    app: phoenix-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
